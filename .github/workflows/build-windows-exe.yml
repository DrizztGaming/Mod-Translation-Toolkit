name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - dotnet
    tags:
      - "v1.*"
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Source audit
        shell: pwsh
        run: ./tools/source-audit.ps1

      - name: Restore
        run: dotnet restore ModTranslationToolkit.sln

      - name: Build
        run: dotnet build ModTranslationToolkit.sln -c Release --no-restore

      - name: Publish framework-dependent
        run: >
          dotnet publish src/ModTranslationToolkit/ModTranslationToolkit.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/framework-dependent

      - name: Publish self-contained multi-file
        run: >
          dotnet publish src/ModTranslationToolkit/ModTranslationToolkit.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/self-contained

      - name: Upload framework-dependent build
        uses: actions/upload-artifact@v4
        with:
          name: ModTranslationToolkit-v1-framework-dependent-win-x64
          path: publish/framework-dependent/**
          if-no-files-found: error

      - name: Upload self-contained build
        uses: actions/upload-artifact@v4
        with:
          name: ModTranslationToolkit-v1-self-contained-win-x64
          path: publish/self-contained/**
          if-no-files-found: error
